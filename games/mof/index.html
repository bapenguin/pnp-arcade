<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Massacre of the Fairies</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#003300" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #game {
        position: absolute;
        cursor: crosshair;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #fullscreen {
        position: fixed;
        right: 6px;
        bottom: 6px;
        z-index: 5;
        width: 34px;
        height: 34px;
        padding: 0;
        font-size: 20px;
        line-height: 1;
        color: #cfc;
        background: rgba(0, 40, 0, 0.6);
        border: 1px solid rgba(160, 255, 160, 0.4);
        border-radius: 4px;
        cursor: pointer;
        opacity: 0.5;
      }
      #fullscreen:hover {
        opacity: 1;
      }
      #install {
        position: fixed;
        right: 46px;
        bottom: 6px;
        z-index: 5;
        height: 34px;
        padding: 0 12px;
        font: bold 13px Arial, sans-serif;
        color: #cfc;
        background: rgba(0, 40, 0, 0.75);
        border: 1px solid rgba(160, 255, 160, 0.5);
        border-radius: 4px;
        cursor: pointer;
      }
      #install[hidden] {
        display: none;
      }
      /* The game is 4:3 landscape; on a phone held upright it would be tiny. */
      #rotate {
        display: none;
      }
      @media (orientation: portrait) and (max-width: 700px) {
        #rotate {
          display: flex;
          position: fixed;
          inset: 0;
          z-index: 10;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          background: rgba(0, 0, 0, 0.88);
          color: #8f8;
          font: bold 20px Arial, sans-serif;
          text-align: center;
          padding: 24px;
        }
        #rotate span {
          font-size: 56px;
        }
      }
      /* Menu layer: laid out in the original's 1024x768 pixels, scaled to fit. */
      #ui {
        position: absolute;
        width: 1024px;
        height: 768px;
        transform-origin: 0 0;
        pointer-events: none;
        font-family: Arial, Helvetica, sans-serif;
        user-select: none;
      }
      #ui > * {
        pointer-events: auto;
      }
      #ui .abs {
        position: absolute;
      }
      #ui .panel {
        position: absolute;
        background-repeat: no-repeat;
        overflow: hidden;
      }
      #ui .link {
        position: absolute;
        cursor: pointer;
        text-align: center;
        white-space: nowrap;
      }
      #ui .link.disabled {
        cursor: default;
        opacity: 0.45;
      }
      /* VB command buttons, Windows 98 style. */
      #ui button {
        position: absolute;
        font: 13px Tahoma, 'MS Sans Serif', Arial, sans-serif;
        color: #000;
        background: #d4d0c8;
        border: 2px outset #fff;
        padding: 0;
        cursor: pointer;
      }
      #ui button:active {
        border-style: inset;
      }
      #ui input[type='text'] {
        position: absolute;
        font: 15px Arial, sans-serif;
        border: 2px inset #fff;
        padding: 1px 4px;
        box-sizing: border-box;
      }
      #ui label.check {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 4px;
        font: 13px Tahoma, 'MS Sans Serif', Arial, sans-serif;
        color: #fff;
        background: rgb(128, 64, 0);
        cursor: pointer;
      }
      /* VB ListBoxes */
      #ui select {
        position: absolute;
        font: 13px Tahoma, 'MS Sans Serif', Arial, sans-serif;
        border: 2px inset #fff;
        background: #fff;
        box-sizing: border-box;
      }
      #ui input:disabled {
        background: #d4d0c8;
      }
      #ui .list {
        position: absolute;
        overflow-y: auto;
        font: 14px 'Courier New', monospace;
        white-space: pre;
        padding: 4px;
        box-sizing: border-box;
      }
      /* Touch rails beside the game on phones/tablets (src/ui/rails.ts). Real CSS px. */
      body.has-rails #fullscreen,
      body.has-rails #install {
        display: none;
      }
      .rail {
        position: fixed;
        z-index: 4;
        box-sizing: border-box;
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-family: Arial, Helvetica, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
        transition: opacity 0.2s;
      }
      .rail.inactive {
        opacity: 0.45;
      }
      .rail button {
        font: inherit;
        color: #cfc;
        background: rgba(0, 40, 0, 0.85);
        border: 1px solid rgba(160, 255, 160, 0.35);
        border-radius: 8px;
        padding: 0;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .rail button:active {
        background: rgba(40, 110, 40, 0.95);
      }
      .rail-left {
        align-items: stretch;
      }
      .rail-pause {
        flex: 0 0 48px;
        font-size: 18px !important;
      }
      .rail-full {
        flex: 0 0 40px;
        margin-top: auto;
        font-size: 20px !important;
        opacity: 0.7;
      }
      .rail-level {
        font-size: 12px;
        font-weight: bold;
        line-height: 1.2;
        color: #8f8;
        text-align: center;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .rail-stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1.1;
        padding: 4px 2px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.35);
      }
      .rail-stat span {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #8c8;
      }
      .rail-stat b {
        font-size: 18px;
        color: rgb(240, 242, 86);
        font-variant-numeric: tabular-nums;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rail-right {
        display: grid;
        grid-template-columns: 1fr;
        grid-auto-rows: 1fr;
      }
      .rail-right.two-col {
        grid-template-columns: 1fr 1fr;
      }
      .rail-weapon {
        --cd: 0;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-height: 0;
        overflow: hidden;
      }
      /* Reload sweep, like the HUD weapon box's. */
      .rail-weapon::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: conic-gradient(rgba(0, 0, 0, 0.6) calc(var(--cd) * 360deg), transparent 0);
      }
      .rail-right.two-col .rail-weapon {
        flex-direction: column;
        gap: 0;
      }
      .rail-weapon img {
        height: min(34px, 80%);
        aspect-ratio: 1;
        border-radius: 4px;
      }
      .rail-weapon .num {
        position: absolute;
        top: 1px;
        left: 4px;
        font-size: 10px;
        color: #8c8;
      }
      .rail-weapon .ammo {
        font-size: 13px;
        font-weight: bold;
        color: rgb(240, 242, 86);
        font-variant-numeric: tabular-nums;
      }
      .rail-weapon.selected {
        border: 2px solid rgb(240, 242, 86);
        background: rgba(60, 90, 0, 0.9);
      }
      .rail-weapon.empty {
        opacity: 0.35;
      }
      /* Touch menus (src/scenes/menu-touch.ts): full screen, real CSS px, finger-sized. */
      .tm {
        --tm-panel: rgba(0, 32, 0, 0.82);
        --tm-line: rgba(160, 255, 160, 0.28);
        --tm-text: #dfd;
        --tm-muted: #9c9;
        --tm-green: rgb(0, 225, 54);
        --tm-yellow: rgb(240, 242, 86);
        position: fixed;
        inset: 0;
        z-index: 6;
        box-sizing: border-box;
        padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom))
          max(12px, env(safe-area-inset-left));
        background-color: #001800;
        background-size: cover;
        background-position: center;
        color: var(--tm-text);
        font: 16px/1.3 Arial, Helvetica, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      .tm * {
        box-sizing: border-box;
      }
      .tm-screen {
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
      }
      .tm-btn {
        font: bold 17px Arial, Helvetica, sans-serif;
        color: var(--tm-text);
        background: var(--tm-panel);
        border: 1px solid var(--tm-line);
        border-radius: 10px;
        min-height: 48px;
        padding: 8px 14px;
        cursor: pointer;
      }
      .tm-btn:active,
      .tm-level:active,
      .tm-player-go:active,
      .tm-scenario:active {
        filter: brightness(1.35);
      }
      .tm-primary {
        background: var(--tm-yellow);
        color: #1a2a00;
        border-color: transparent;
      }
      /* Main menu: logo on one side, big buttons on the other. */
      .tm-main {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 4vw;
      }
      .tm-brand {
        flex: 0 1 44%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .tm-title {
        width: min(60%, 220px);
      }
      .tm-logo {
        width: min(100%, 360px);
        max-height: 55vh;
        object-fit: contain;
      }
      .tm-actions {
        flex: 0 1 46%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 420px;
      }
      .tm-big {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        min-height: 64px;
        font-size: 21px;
        text-align: left;
        color: var(--tm-green);
      }
      .tm-big small {
        font: 13px Arial, Helvetica, sans-serif;
        color: var(--tm-muted);
      }
      .tm-pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      /* Screen header */
      .tm-head {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 0 0 auto;
      }
      .tm-back {
        flex: 0 0 auto;
      }
      .tm-heading {
        min-width: 0;
      }
      .tm-heading h1 {
        margin: 0;
        font-size: 22px;
        color: var(--tm-green);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 1px 2px #000;
      }
      .tm-heading p {
        margin: 0;
        font-size: 13px;
        color: var(--tm-muted);
      }
      .tm-body {
        flex: 1 1 auto;
        min-height: 0;
      }
      /* Two columns: a scrolling list, and a side panel of controls. */
      .tm-split {
        height: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(210px, 36%);
        gap: 12px;
      }
      .tm-list,
      .tm-side {
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        -webkit-overflow-scrolling: touch;
      }
      .tm-side {
        padding: 12px;
        border-radius: 12px;
        background: var(--tm-panel);
        border: 1px solid var(--tm-line);
      }
      .tm-label {
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--tm-muted);
      }
      .tm-hint,
      .tm-empty {
        margin: 0;
        font-size: 13px;
        color: var(--tm-muted);
      }
      .tm input[type='text'] {
        font: 17px Arial, Helvetica, sans-serif; /* 16px+ stops iOS zooming in */
        min-height: 48px;
        padding: 0 12px;
        border-radius: 10px;
        border: 1px solid var(--tm-line);
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        user-select: text;
        -webkit-user-select: text;
      }
      /* Players */
      .tm-player {
        display: flex;
        gap: 8px;
      }
      .tm-player-go {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 60px;
        padding: 6px 12px 6px 6px;
        font: inherit;
        color: inherit;
        text-align: left;
        background: var(--tm-panel);
        border: 1px solid var(--tm-line);
        border-radius: 10px;
        cursor: pointer;
      }
      .tm-player-go img {
        width: 48px;
        height: 48px;
        object-fit: cover;
        border-radius: 8px;
        flex: 0 0 auto;
      }
      .tm-player-text {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .tm-player-name {
        font-size: 19px;
        font-weight: bold;
        color: var(--tm-green);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tm-player-sub {
        font-size: 13px;
        color: var(--tm-muted);
      }
      .tm-icon {
        flex: 0 0 auto;
        font-size: 14px;
      }
      /* Scenarios */
      .tm-grid {
        height: 100%;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 10px;
        align-content: start;
      }
      .tm-scenario {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 8px;
        font: inherit;
        color: inherit;
        text-align: left;
        background: var(--tm-panel);
        border: 1px solid var(--tm-line);
        border-radius: 12px;
        cursor: pointer;
      }
      .tm-scenario img {
        width: 100%;
        aspect-ratio: 104 / 79;
        object-fit: cover;
        border-radius: 8px;
      }
      .tm-scenario-title {
        font-size: 17px;
        font-weight: bold;
        color: var(--tm-green);
      }
      .tm-scenario-desc {
        font-size: 13px;
        color: var(--tm-muted);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .tm-scenario.locked {
        cursor: default;
        opacity: 0.55;
      }
      .tm-scenario.locked img {
        filter: grayscale(1) brightness(0.45);
      }
      /* Levels */
      .tm-level {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 50px;
        flex: 0 0 auto;
        padding: 0 14px;
        font: 17px Arial, Helvetica, sans-serif;
        color: var(--tm-green);
        text-align: left;
        background: var(--tm-panel);
        border: 1px solid var(--tm-line);
        border-radius: 10px;
        cursor: pointer;
      }
      .tm-level.selected {
        border: 2px solid var(--tm-yellow);
        background: rgba(50, 80, 0, 0.92);
      }
      .tm-level:disabled {
        cursor: default;
        color: rgba(0, 192, 0, 0.5);
        font-style: italic;
      }
      .tm-level-num {
        flex: 0 0 22px;
        color: var(--tm-muted);
      }
      .tm-level-name {
        flex: 1;
        min-width: 0;
      }
      .tm-stars {
        color: rgb(255, 204, 0);
        letter-spacing: 2px;
        font-size: 19px;
        font-style: normal;
      }
      .tm-seg {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border: 1px solid var(--tm-line);
        border-radius: 10px;
        overflow: hidden;
      }
      .tm-seg button {
        min-height: 44px;
        font: bold 15px Arial, Helvetica, sans-serif;
        color: var(--tm-text);
        background: transparent;
        border: 0;
        cursor: pointer;
      }
      .tm-seg button + button {
        border-left: 1px solid var(--tm-line);
      }
      .tm-seg button.on {
        background: var(--tm-green);
        color: #002000;
      }
      .tm-start {
        margin-top: auto;
        min-height: 60px;
        font-size: 22px;
      }
      /* Options */
      .tm-toggles {
        height: 100%;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 10px;
        align-content: start;
      }
      .tm-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 56px;
        padding: 0 16px;
        font-size: 18px;
        background: var(--tm-panel);
        border: 1px solid var(--tm-line);
        border-radius: 10px;
        cursor: pointer;
      }
      .tm-toggle input {
        appearance: none;
        -webkit-appearance: none;
        flex: 0 0 auto;
        width: 52px;
        height: 30px;
        margin: 0;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.2);
        position: relative;
        cursor: pointer;
        transition: background 0.15s;
      }
      .tm-toggle input::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s;
      }
      .tm-toggle input:checked {
        background: var(--tm-green);
      }
      .tm-toggle input:checked::after {
        transform: translateX(22px);
      }
      /* Stats and Hall of Fame */
      .tm-stats {
        min-height: 0;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 8px;
        align-content: start;
      }
      .tm-face {
        width: 100%;
        max-width: 150px;
        aspect-ratio: 121 / 113;
        object-fit: cover;
        border-radius: 10px;
        grid-row: span 2;
      }
      .tm-stat,
      .tm-hof-row {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 8px 12px;
        background: var(--tm-panel);
        border: 1px solid var(--tm-line);
        border-radius: 10px;
      }
      .tm-stat span,
      .tm-hof-row span {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--tm-muted);
      }
      .tm-stat b,
      .tm-hof-row b {
        font-size: 18px;
        color: var(--tm-yellow);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tm-kill {
        display: flex;
        gap: 10px;
        font-size: 15px;
      }
      .tm-kill b {
        flex: 0 0 48px;
        text-align: right;
        color: var(--tm-yellow);
      }
      .tm-hof {
        height: 100%;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 10px;
        align-content: start;
      }
      .tm-hof-row span {
        color: #f66;
      }
      .tm-toast {
        position: absolute;
        left: 50%;
        bottom: max(14px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: min(90%, 520px);
        padding: 12px 16px;
        border-radius: 12px;
        background: #d4d0c8;
        color: #000;
        font-size: 15px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
        cursor: pointer;
      }
      /* Massacre builder on touch (src/scenes/massacre-touch.ts) */
      .mm-go {
        margin-left: auto;
        min-width: 110px;
        font-size: 22px;
      }
      .mm-bar {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .mm-tabs {
        flex: 1 1 300px;
      }
      .mm-tabs button {
        min-height: 44px;
      }
      .mm-actions {
        display: flex;
        gap: 8px;
      }
      .mm-actions .tm-btn {
        min-height: 44px;
        font-size: 15px;
        padding: 6px 12px;
      }
      .mm-body {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .mm-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
        padding-bottom: 8px;
      }
      .mm-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px;
        background: var(--tm-panel);
        border: 1px solid var(--tm-line);
        border-radius: 12px;
        text-align: center;
      }
      .mm-card.picked {
        border: 2px solid var(--tm-yellow);
        background: rgba(50, 80, 0, 0.9);
      }
      .mm-thumb-box {
        height: 64px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mm-thumb {
        max-height: 64px;
        height: 64px;
        max-width: 100%;
        background-repeat: no-repeat;
        background-position: 0 0;
      }
      .mm-icon {
        width: 48px;
        height: 48px;
        border-radius: 6px;
      }
      .mm-name {
        font-weight: bold;
        font-size: 15px;
        color: var(--tm-green);
        line-height: 1.15;
        min-height: 2.3em;
        display: flex;
        align-items: center;
      }
      .mm-tag {
        font-size: 12px;
        color: #f99;
      }
      .mm-tag.good {
        color: var(--tm-muted);
      }
      .mm-stepper {
        display: flex;
        align-items: stretch;
        gap: 4px;
        width: 100%;
        margin-top: auto;
      }
      .mm-stepper .tm-btn {
        flex: 0 0 44px;
        min-height: 44px;
        padding: 0;
        font-size: 24px;
      }
      .mm-stepper .tm-btn:disabled {
        opacity: 0.35;
      }
      .tm .mm-stepper input[type='text'] {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 0 4px;
        text-align: center;
        font-weight: bold;
        color: var(--tm-yellow);
      }
      .mm-switch {
        width: 100%;
        min-height: 44px;
        padding: 0 8px;
        font-size: 13px;
        background: transparent;
        border: 0;
      }
      .mm-scene {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding-bottom: 8px;
      }
      .mm-section {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .mm-tiles {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 136px;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
        -webkit-overflow-scrolling: touch;
      }
      .mm-tile {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 4px;
        font: 12px Arial, Helvetica, sans-serif;
        color: var(--tm-text);
        text-transform: capitalize;
        background: var(--tm-panel);
        border: 1px solid var(--tm-line);
        border-radius: 10px;
        cursor: pointer;
      }
      .mm-tile img {
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        border-radius: 6px;
        background: #000;
      }
      .mm-tile.on,
      .mm-chip.on {
        border: 2px solid var(--tm-yellow);
        background: rgba(50, 80, 0, 0.92);
      }
      .mm-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .mm-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        padding: 4px 14px;
        font: bold 15px Arial, Helvetica, sans-serif;
        color: var(--tm-text);
        text-transform: capitalize;
        background: var(--tm-panel);
        border: 1px solid var(--tm-line);
        border-radius: 22px;
        cursor: pointer;
      }
      .mm-chip img {
        height: 26px;
        width: 120px;
        object-fit: contain;
        object-position: bottom;
        border-radius: 4px;
        background: linear-gradient(#7fa7cf, #c9dbe9); /* sky, so the transparent strip's plants show */
      }
      .mm-row {
        display: grid;
        grid-template-columns: minmax(200px, 1fr) minmax(0, 2fr);
        gap: 12px;
      }
      .mm-time {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .mm-time .mm-stepper {
        width: 170px;
        margin: 0;
      }
      .mm-toast {
        display: flex;
        flex-direction: column;
        gap: 8px;
        cursor: default;
      }
      .mm-toast .tm-btn {
        align-self: flex-end;
        min-height: 40px;
        color: #000;
        background: #fff;
        border-color: #999;
      }
      .tm .mm-link {
        min-height: 40px;
        font-size: 16px;
        color: #000;
        background: #fff;
        user-select: all;
      }
      /* Squarer screens (tablets held upright): stack the columns. */
      @media (max-aspect-ratio: 1/1) {
        .tm-main {
          flex-direction: column;
        }
        .tm-split {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(0, 1fr) auto;
        }
      }
      .rail-weapon.empty .ammo {
        color: #f88;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1024" height="768"></canvas>
    <div id="ui"></div>
    <button id="fullscreen" title="Fullscreen (F)" aria-label="Toggle fullscreen">⛶</button>
    <button id="install" title="Install the game on this device" hidden>Install</button>
    <div id="rotate"><span>⟳</span>Turn your phone sideways to massacre fairies</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
