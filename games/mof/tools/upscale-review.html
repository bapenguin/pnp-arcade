<!doctype html>
<!-- Review page for `npm run upscale`: the shipped art next to the 2x version, animated.
     Open via the dev server: npm run dev, then /tools/upscale-review.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upscale Review</title>
<style>
:root{--bg:#f4f4f1;--fg:#1d1d1b;--muted:#6b6b66;--line:#d9d9d3;--card:#fff;--accent:#2f6b3a;--flag:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161715;--fg:#e9e9e4;--muted:#9a9a93;--line:#2e302c;--card:#1f201e;--accent:#7fc48a;--flag:#ff8a80}}
:root[data-theme=dark]{--bg:#161715;--fg:#e9e9e4;--muted:#9a9a93;--line:#2e302c;--card:#1f201e;--accent:#7fc48a;--flag:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1400px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
p.lede{color:var(--muted);margin:0 0 12px;max-width:80ch}
.bar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 12px;margin:0 -12px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--fg);padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--bg)}
input[type=search]{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);width:160px}
#flagged{font-size:13px;color:var(--muted)}
#flagged b{color:var(--flag)}
#copy{font:inherit;font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);cursor:pointer}
.asset{margin:0 0 18px}
.asset h2{font-size:15px;margin:0 0 6px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.asset h2 small{color:var(--muted);font-weight:400;font-size:12.5px}
.asset h2 label{margin-left:auto;font-size:13px;font-weight:400;display:flex;gap:5px;align-items:center;cursor:pointer}
.asset.is-flagged h2{color:var(--flag)}
.pair{display:flex;flex-wrap:wrap;gap:10px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;max-width:100%}
.stage{display:flex;align-items:center;justify-content:center;padding:8px;overflow:auto;background-size:cover;background-position:center}
.stage canvas{display:block;max-width:100%;height:auto}
.cap{padding:5px 10px;font-size:12.5px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.cap span{color:var(--muted)}
.note{color:var(--muted);font-size:12.5px;margin:2px 0 6px}
</style>
</head>
<body>
<main>
<h1>Upscale review</h1>
<p class="lede">Every sprite, foreground and background: the shipped art next to the cleaned, Real-ESRGAN 2× version, drawn at the same on-screen size and animated frame by frame. Tick <em>Flag</em> on anything that looks wrong; the flagged list at the top can be copied into a message.</p>
<div class="bar">
  <label>Show <span class="seg" id="groupSel"><button data-v="sprites" class="on">Sprites</button><button data-v="fg">Foregrounds</button><button data-v="bg">Backgrounds</button></span></label>
  <label>Background <span class="seg" id="bgSel"><button data-v="dark">Dark</button><button data-v="light" class="on">Light</button><button data-v="game">Game</button></span></label>
  <label>Zoom <span class="seg" id="zoomSel"><button data-v="1">1×</button><button data-v="2" class="on">2×</button><button data-v="3">3×</button></span></label>
  <label>Animation <span class="seg" id="playSel"><button data-v="play" class="on">Play</button><button data-v="pause">Pause</button></span></label>
  <input type="search" id="filter" placeholder="Filter by name">
  <span id="flagged"></span>
</div>
<div id="list"></div>
</main>
<script type="module">
// Small baked-in text the upscaler smears: these HD versions are redrawn as vector art
// by tools/redraw-text-art.mjs instead (keep in step with REDRAWN in upscale-assets.mjs).
const REDRAWN = new Set(['0', '25', '50', '100', '200', '500', '1000', 'howieammo']);
const shipped = await (await fetch('/assets/manifest.json')).json();
const up = await (await fetch('/assets/hd/manifest.json')).json();
const state = { group: 'sprites', bg: 'light', zoom: 2, playing: true, frame: 0, filter: '' };
let flags = new Set();
try { flags = new Set(JSON.parse(localStorage.getItem('upscale-flags') || '[]')); } catch {}
const saveFlags = () => { try { localStorage.setItem('upscale-flags', JSON.stringify([...flags])); } catch {} };
const gameBg = '/assets/' + shipped.bg.beach.file;
const list = document.getElementById('list');
let cells = [];

function img(src) {
  const i = new Image();
  i.src = src;
  i.onload = draw;
  return i;
}

function render() {
  list.textContent = '';
  cells = [];
  for (const [key, u] of Object.entries(up[state.group])) {
    if (state.filter && !key.includes(state.filter)) continue;
    const s = shipped[state.group][key];
    if (!s) continue;
    const [fx, fy] = u.frames ?? [1, 1];
    const fw = Math.floor(s.w / fx), fh = Math.floor(s.h / fy);
    const box = document.createElement('section');
    box.className = 'asset' + (flags.has(`${state.group}/${key}`) ? ' is-flagged' : '');
    const h2 = document.createElement('h2');
    h2.innerHTML = `${key} <small>${fx}×${fy} frames of ${fw}×${fh}</small>`;
    const flag = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = flags.has(`${state.group}/${key}`);
    cb.onchange = () => {
      const id = `${state.group}/${key}`;
      cb.checked ? flags.add(id) : flags.delete(id);
      box.classList.toggle('is-flagged', cb.checked);
      saveFlags();
      showFlags();
    };
    flag.append(cb, 'Flag');
    h2.append(flag);
    box.append(h2);
    if (REDRAWN.has(key)) {
      const n = document.createElement('div');
      n.className = 'note';
      n.textContent = 'Small baked-in text: the HD version is redrawn (npm run redraw), not upscaled.';
      box.append(n);
    }
    const pair = document.createElement('div');
    pair.className = 'pair';
    for (const [label, src, scale] of [['Shipped', '/assets/' + s.file, 1], [REDRAWN.has(key) ? '2× redrawn' : '2× x4plus', '/assets/hd/' + u.file, 2]]) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const stage = document.createElement('div');
      stage.className = 'stage';
      const c = document.createElement('canvas');
      stage.append(c);
      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.innerHTML = `<b>${label}</b><span>${src.split('/').pop()}</span>`;
      cell.append(stage, cap);
      pair.append(cell);
      cells.push({ c, stage, image: img(src), scale, fx, fy, fw, fh });
    }
    box.append(pair);
    list.append(box);
  }
  layout();
}

function layout() {
  const dpr = window.devicePixelRatio || 1;
  // Backgrounds are big: show them at half size so a pair fits side by side.
  const zoom = state.group === 'sprites' ? state.zoom : state.zoom / 2;
  for (const k of cells) {
    const w = k.fw * zoom, h = k.fh * zoom;
    k.c.style.width = `${w}px`;
    k.c.width = Math.round(w * dpr);
    k.c.height = Math.round(h * dpr);
    k.stage.style.background = state.bg === 'dark' ? '#111' : state.bg === 'light' ? '#dfe9ef' : `center/cover url(${gameBg})`;
  }
  draw();
}

function draw() {
  for (const k of cells) {
    const ctx = k.c.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.clearRect(0, 0, k.c.width, k.c.height);
    if (!k.image.complete || !k.image.naturalWidth) continue;
    const f = state.frame % (k.fx * k.fy);
    const x = f % k.fx, y = Math.floor(f / k.fx);
    ctx.drawImage(k.image, x * k.fw * k.scale, y * k.fh * k.scale, k.fw * k.scale, k.fh * k.scale, 0, 0, k.c.width, k.c.height);
  }
}

function showFlags() {
  const el = document.getElementById('flagged');
  el.innerHTML = flags.size ? `<b>${flags.size} flagged</b> ` : 'Nothing flagged';
  if (flags.size) {
    const b = document.createElement('button');
    b.id = 'copy';
    b.textContent = 'Copy list';
    b.onclick = () => {
      const text = [...flags].sort().join(', ');
      navigator.clipboard?.writeText(text).then(() => (b.textContent = 'Copied'), () => prompt('Flagged assets:', text));
    };
    el.append(b);
  }
}

function seg(id, fn) {
  const el = document.getElementById(id);
  el.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    for (const x of el.children) x.classList.toggle('on', x === b);
    fn(b.dataset.v);
  });
}
seg('groupSel', (v) => { state.group = v; render(); });
seg('bgSel', (v) => { state.bg = v; layout(); });
seg('zoomSel', (v) => { state.zoom = +v; layout(); });
seg('playSel', (v) => { state.playing = v === 'play'; });
document.getElementById('filter').addEventListener('input', (e) => { state.filter = e.target.value.trim().toLowerCase(); render(); });
setInterval(() => { if (state.playing) { state.frame++; draw(); } }, 110);
showFlags();
render();
</script>
</body>
</html>
