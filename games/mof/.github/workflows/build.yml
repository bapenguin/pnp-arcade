name: Build and deploy

# Builds the game on every push. On main it also publishes to GitHub Pages
# (https://bapenguin.github.io/MoF/). Every run attaches the ready-to-upload
# site as a downloadable artifact ("mof-web") for hosting anywhere else.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Converted assets in public/assets and data/ are committed, so CI
      # doesn't need the raw legacy media or ffmpeg.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: mof-web
          path: dist
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
